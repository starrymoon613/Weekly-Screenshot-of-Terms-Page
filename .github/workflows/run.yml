name: Weekly CV Terms Screenshot

on:
  workflow_dispatch:

  schedule:
    - cron: '0 13 * * 5'

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Generate screenshot
        env:
          URL: https://cv.hres.ca/en/terms/15
          DAYS: '5'
          OUTPUT: screenshot.png
        run: node .github/actions/cv-terms-screenshot/screenshot.js

      - run: test -f screenshot.png

      - uses: actions/upload-artifact@v4
        with:
          name: cv-terms-screenshot
          path: screenshot.png
